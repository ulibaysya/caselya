all: false
dir: "{{.InterfaceDir}}"
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}"
recursive: false
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  github.com/ulibaysya/caselya/internal/modules:
    config:
      all: true
      recursive: true
  github.com/ulibaysya/caselya/internal/modules/user:
    interfaces:
      DataChanger:
        configs:
          - dir: "./internal/modules/container/service"
            filename: mocks_datachanger_test.go
            pkgname: service
          - dir: "./internal/modules/user/storage"
            filename: mocks_datachanger_test.go
            pkgname: storage
